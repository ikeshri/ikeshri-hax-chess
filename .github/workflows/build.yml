name: Build ikeshri hax APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fetch Stockfish Android Engine
        run: |
          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/stockfish https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-android-armv8.tar || touch app/src/main/assets/stockfish

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ikeshri-hax-v1.0
          path: app/build/outputs/apk/debug/app-debug.apk
