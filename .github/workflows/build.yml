name: Build ikeshri hax APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fetch Stockfish & NNUE Weights
        run: |
          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/stockfish https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-android-armv8.tar || touch app/src/main/assets/stockfish
          curl -L -o app/src/main/assets/nnue.nnue https://tests.stockfishchess.org/api/nn/nn-1111cefa1111.nnue || touch app/src/main/assets/nnue.nnue

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK with Gradle
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ikeshri-hax-v1.0
          path: app/build/outputs/apk/debug/*.apk
